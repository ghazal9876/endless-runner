<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Mission</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; overflow: hidden; display: grid; place-items: center; color: #edf7ff; background: radial-gradient(circle at 70% 42%, #49338377, transparent 28%), radial-gradient(circle at 18% 78%, #1669a855, transparent 26%), linear-gradient(145deg, #050719, #0b1243 52%, #140d35); }
    .stars, .stars::before, .stars::after { position: fixed; inset: 0; content: ""; pointer-events: none; background-image: radial-gradient(#dff6ff 1px, transparent 1.5px), radial-gradient(#9bc9ff 1px, transparent 1.5px); background-size: 76px 76px, 123px 123px; background-position: 14px 23px, 42px 68px; opacity: .55; }
    .mission { position: relative; width: min(620px, calc(100vw - 36px)); text-align: center; padding: 54px 28px; border: 1px solid #7399e955; border-radius: 28px; background: #091334a8; box-shadow: 0 30px 90px #0009, inset 0 0 80px #5479e21f; backdrop-filter: blur(10px); }
    .logo { width: 112px; height: 112px; margin: 0 auto 20px; display: grid; place-items: center; border: 1px solid #88e9ff77; border-radius: 50%; background: radial-gradient(circle at 42% 34%, #c2f8ff, #4bb9df 22%, #26247a 56%, #101333 72%); box-shadow: 0 0 45px #4fe0ff55; font-size: 48px; transform: rotate(-15deg); }
    .eyebrow { margin: 0 0 9px; color: #a7bbec; font-size: 12px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(46px, 10vw, 78px); letter-spacing: -.07em; line-height: .95; }
    p { max-width: 400px; margin: 18px auto 28px; color: #b8c8e9; line-height: 1.6; }
    .levels { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    .start { display: inline-flex; align-items: center; gap: 10px; padding: 14px 23px; border-radius: 999px; color: #061020; background: #79eaff; box-shadow: 0 8px 26px #42cfff44; font-weight: 900; text-decoration: none; transition: transform .2s, background .2s; }
    .start:hover { transform: translateY(-2px); background: #c7f7ff; }
    .start.level-two { color: #fff5ff; background: #a961e8; box-shadow: 0 8px 26px #a961e844; }
    .start.level-two:hover { background: #cf9cff; }
    .details { margin-top: 22px; color: #8296c3; font-size: 12px; }
    .sound-toggle { margin-top: 16px; border: 1px solid #7de7ff66; border-radius: 999px; padding: 8px 13px; color: #ccefff; background: #101d42bb; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; }
    .sound-toggle:hover { background: #1b3268; }
  </style>
</head>
<body>
  <div class="stars"></div>
  <audio id="menu-music" src="assets/victory-tune.ogg" loop autoplay preload="auto"></audio>
  <main class="mission">
    <div class="logo" aria-hidden="true">🚀</div>
    <p class="eyebrow">Orbital Command</p>
    <h1>Space<br />Mission</h1>
    <p>Launch into a dangerous deep-space route. Dodge threats, return fire, and push your mission score as far as it can go.</p>
    <div class="levels">
      <a class="start" href="level1.html">Start Level 1 <span aria-hidden="true">→</span></a>
      <a class="start level-two" href="level1.html?level=2">Start Level 2 <span aria-hidden="true">→</span></a>
    </div>
    <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false">Play soundtrack</button>
    <div class="details">Choose a mission · Arrow keys or touch to fly · Space or FIRE to shoot</div>
  </main>
  <script>
    const menuMusic=document.getElementById('menu-music'),soundToggle=document.getElementById('sound-toggle');
    const updateSoundButton=()=>{const playing=!menuMusic.paused;soundToggle.textContent=playing?'Pause soundtrack':'Play soundtrack';soundToggle.setAttribute('aria-pressed',String(playing));};
    const startMenuMusic=()=>menuMusic.play().then(updateSoundButton).catch(updateSoundButton);
    document.addEventListener('pointerdown',startMenuMusic,{once:true,capture:true});
    document.addEventListener('keydown',startMenuMusic,{once:true,capture:true});
    soundToggle.addEventListener('click',()=>{if(menuMusic.paused)startMenuMusic();else{menuMusic.pause();updateSoundButton();}});
    menuMusic.play().then(updateSoundButton).catch(updateSoundButton);
  </script>
</body>
</html>
