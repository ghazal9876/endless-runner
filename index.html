<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Night Flight — Endless Runner</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: #050a18; color: #f7fbff; }
    .shell { width: min(1100px, 100vw); padding: 18px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .brand { letter-spacing: .18em; text-transform: uppercase; font-size: 12px; color: #9fb0d2; font-weight: 800; }
    .score { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 800; }
    .score span { color: #72e2ff; }
    .game-wrap { position: relative; border: 1px solid #26365d; border-radius: 18px; overflow: hidden; box-shadow: 0 22px 70px #0008, inset 0 0 80px #1d315b55; background: #08132d; }
    canvas { width: 100%; height: min(70vh, 650px); min-height: 420px; display: block; cursor: pointer; }
    .hint { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); color: #c9d9f7; font-size: 13px; white-space: nowrap; opacity: .76; pointer-events: none; }
    .panel { position: absolute; inset: 0; display: grid; place-items: center; background: #04081799; backdrop-filter: blur(5px); }
    .card { text-align: center; padding: 26px 34px; border: 1px solid #6788c955; border-radius: 16px; background: #0a1530dd; box-shadow: 0 10px 35px #0007; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 48px); letter-spacing: -.05em; }
    .card p { margin: 0 0 18px; color: #afc0df; }
    button { border: 0; border-radius: 999px; padding: 11px 20px; color: #05101d; background: #72e2ff; font-weight: 900; cursor: pointer; }
    button:hover { background: #b8f2ff; transform: translateY(-1px); }
    .mobile-controls { display: none; }
    @media (max-width: 600px) { .shell { padding: 10px; } canvas { min-height: 460px; height: 72vh; } .hint { display:none; } .mobile-controls { display: flex; position: absolute; left: 14px; right: 14px; bottom: 14px; justify-content: space-between; pointer-events: none; } .mobile-controls button { pointer-events: auto; width: 54px; height: 54px; padding: 0; font-size: 22px; background: #233b6dcc; color: white; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar"><div class="brand">✦ Night Flight / Endless Runner</div><div class="score">SCORE <span id="score">0000</span></div></div>
    <section class="game-wrap">
      <canvas id="game" aria-label="Night sky jet runner game"></canvas>
      <div class="hint">← / → to change lanes · explore the night sky</div>
      <div class="mobile-controls"><button id="left" aria-label="Steer left">←</button><button id="right" aria-label="Steer right">→</button></div>
      <div class="panel" id="panel"><div class="card"><h1 id="title">Night Flight</h1><p id="message">Guide your jet through the midnight skyline.</p><button id="start">Start flight</button></div></div>
    </section>
  </main>
  <script>
    const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score'), panel = document.getElementById('panel'), title = document.getElementById('title'), message = document.getElementById('message'), start = document.getElementById('start');
    let W, H, dpr, jet, stars, planets, comets, score, playing = false, last = 0, spaceOffset = 0;
    const resize = () => { const r = canvas.getBoundingClientRect(); dpr = Math.min(devicePixelRatio || 1, 2); W = r.width; H = r.height; canvas.width = W*dpr; canvas.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); stars = Array.from({length: Math.max(180, W/3)}, () => ({x: Math.random()*W, y: Math.random()*H, r: Math.random()*2+.25, a: Math.random()*.75+.16, speed: .025+Math.random()*.08})); const unit=Math.min(W,H); planets=[{x:W*.15,y:H*.62,r:unit*.29,c:'#6eb9d4',shade:'#071528',ring:false,kind:'blue',a:.38},{x:W*.12,y:H*.24,r:unit*.035,c:'#d9d8e9',shade:'#4c526f',ring:false,kind:'rust',a:.55},{x:W*.88,y:H*.17,r:unit*.07,c:'#b18cda',shade:'#35265e',ring:true,kind:'violet',a:.25}]; comets=[{x:W*.18,y:H*.63,phase:0,s:1},{x:W*.86,y:H*.12,phase:2.3,s:.7},{x:W*.45,y:H*.39,phase:4.4,s:.5}]; };
    const laneX = lane => W * (.25 + lane * .25);
    const reset = () => { jet = {x: laneX(1), y: H*.82, lane: 1}; spaceOffset=0; score=0; scoreEl.textContent='0000'; };
    function drawPlanet(p) { ctx.save();ctx.globalAlpha=p.a;ctx.translate(p.x,p.y);ctx.shadowColor=p.c;ctx.shadowBlur=p.r*.28;ctx.fillStyle=p.c+'44';ctx.beginPath();ctx.arc(0,0,p.r*1.08,0,7);ctx.fill();ctx.shadowBlur=0;if(p.ring){ctx.strokeStyle='#ffe2d177';ctx.lineWidth=p.r*.14;ctx.beginPath();ctx.ellipse(0,0,p.r*1.72,p.r*.42,-.28,0,7);ctx.stroke();}ctx.save();ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.clip();const orb=ctx.createRadialGradient(-p.r*.38,-p.r*.43,p.r*.04,0,0,p.r*1.05);orb.addColorStop(0,'#ffffffaa');orb.addColorStop(.18,p.c);orb.addColorStop(.7,p.shade);orb.addColorStop(1,'#05091f');ctx.fillStyle=orb;ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2);if(p.kind==='blue'){ctx.strokeStyle='#d8fbff42';ctx.lineWidth=p.r*.09;[-.45,-.05,.35].forEach(y=>{ctx.beginPath();ctx.moveTo(-p.r,y*p.r);ctx.bezierCurveTo(-p.r*.25,y*p.r-p.r*.16,p.r*.38,y*p.r+p.r*.14,p.r,y*p.r-p.r*.04);ctx.stroke();});}else{ctx.fillStyle=p.kind==='rust'?'#6d353a66':'#fff2df38';[[-.35,-.15,.18],[.28,.21,.13],[-.05,.43,.1],[.38,-.38,.08]].forEach(c=>{ctx.beginPath();ctx.arc(c[0]*p.r,c[1]*p.r,c[2]*p.r,0,7);ctx.fill();ctx.strokeStyle='#321c3a44';ctx.lineWidth=p.r*.025;ctx.stroke();});}ctx.restore();ctx.strokeStyle='#ffffff33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.stroke();ctx.restore(); }
    function drawSky(t) { const drift=spaceOffset;const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090c45');g.addColorStop(.43,'#080d31');g.addColorStop(1,'#020615');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);[[W*.56+drift*.08,H*.39,W*.30,'#1875d944'],[W*.63+drift*.12,H*.53,W*.22,'#b04acb3d'],[W*.47+drift*.05,H*.25,W*.25,'#5a55f033']].forEach(n=>{const glow=ctx.createRadialGradient(n[0],n[1],0,n[0],n[1],n[2]);glow.addColorStop(0,n[3]);glow.addColorStop(.45,n[3].slice(0,7)+'18');glow.addColorStop(1,'#00000000');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);});ctx.fillStyle='#eaf7ff';stars.forEach(s=>{const x=(s.x+drift*(.7+s.r)+W)%W,y=(s.y+t*s.speed)%H;ctx.globalAlpha=s.a*(.65+.35*Math.sin(t/560+s.x));ctx.beginPath();ctx.arc(x,y,s.r,0,7);ctx.fill();});ctx.globalAlpha=1;planets.forEach(p=>drawPlanet({...p,x:p.x+drift*.16}));comets.forEach(c=>{const x=(c.x+t*.08*c.s+drift*.38)% (W+160)-80,y=(c.y+t*.035*c.s)% (H+120)-60;ctx.save();ctx.translate(x,y);ctx.rotate(-.48);const tail=ctx.createLinearGradient(-100,0,8,0);tail.addColorStop(0,'#ffffff00');tail.addColorStop(.75,'#7be9ff99');tail.addColorStop(1,'#fff');ctx.strokeStyle=tail;ctx.lineWidth=2+c.s*2;ctx.beginPath();ctx.moveTo(-110,0);ctx.lineTo(0,0);ctx.stroke();ctx.fillStyle='#fff';ctx.shadowColor='#73eaff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(2,0,2+c.s,0,7);ctx.fill();ctx.restore();}); }
    function drawJet() { ctx.save();ctx.translate(jet.x,jet.y);ctx.rotate((jet.x-laneX(jet.lane))*.004);ctx.shadowColor='#62dfff';ctx.shadowBlur=22;ctx.fillStyle='#e8faff';ctx.beginPath();ctx.moveTo(0,-43);ctx.lineTo(11,7);ctx.lineTo(33,24);ctx.lineTo(10,23);ctx.lineTo(6,31);ctx.lineTo(-6,31);ctx.lineTo(-10,23);ctx.lineTo(-33,24);ctx.lineTo(-11,7);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#55c9ee';ctx.beginPath();ctx.ellipse(0,-12,5,16,0,0,7);ctx.fill();ctx.fillStyle='#87e8ff';ctx.fillRect(-20,12,40,4);ctx.fillStyle='#ffb45e';[-7,7].forEach(x=>{ctx.beginPath();ctx.moveTo(x-4,27);ctx.lineTo(x,43);ctx.lineTo(x+4,27);ctx.fill();});ctx.restore(); }
    function loop(t) { const dt=Math.min((t-last)/16.67,2);last=t;if(playing){jet.x+=(laneX(jet.lane)-jet.x)*Math.min(.12*dt,1);spaceOffset+=((W*.5-jet.x)*.85-spaceOffset)*Math.min(.09*dt,1);score+=dt*.025;scoreEl.textContent=String(Math.floor(score)).padStart(4,'0');}drawSky(t);drawJet();requestAnimationFrame(loop); }
    function begin(){reset();playing=true;panel.style.display='none';last=performance.now();}
    function changeLane(amount){if(playing)jet.lane=Math.max(0,Math.min(2,jet.lane+amount));}
    addEventListener('resize',resize);addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();if(!e.repeat)changeLane(e.code==='ArrowLeft'?-1:1);}if(e.code==='Enter'&&!playing)begin();});start.onclick=begin;
    document.getElementById('left').onclick=()=>changeLane(-1);document.getElementById('right').onclick=()=>changeLane(1);
    resize(); reset(); requestAnimationFrame(loop);
  </script>
</body>
</html>
