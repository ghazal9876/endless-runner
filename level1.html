<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Space Mission — Level 1</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; overflow: hidden; background: #050a18; color: #f7fbff; }
    .shell { position: relative; width: 100%; height: 100vh; height: 100dvh; }
    .topbar { position: absolute; z-index: 2; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: clamp(16px, 3vw, 30px); pointer-events: none; }
    .brand { letter-spacing: .18em; text-transform: uppercase; font-size: 12px; color: #9fb0d2; font-weight: 800; }
    .score { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 800; }
    .score span { color: #72e2ff; }
    .game-wrap { position: relative; width: 100%; height: 100%; overflow: hidden; background: #08132d; }
    canvas { width: 100%; height: 100%; min-height: 0; display: block; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
    .hint { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); color: #c9d9f7; font-size: 13px; white-space: nowrap; opacity: .76; pointer-events: none; }
    .panel { position: absolute; z-index: 4; inset: 0; display: grid; place-items: center; background: #04081799; backdrop-filter: blur(5px); }
    .card { text-align: center; padding: 26px 34px; border: 1px solid #6788c955; border-radius: 16px; background: #0a1530dd; box-shadow: 0 10px 35px #0007; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 48px); letter-spacing: -.05em; }
    .card p { margin: 0 0 18px; color: #afc0df; }
    button { border: 0; border-radius: 999px; padding: 11px 20px; color: #05101d; background: #72e2ff; font-weight: 900; cursor: pointer; }
    button:hover { background: #b8f2ff; transform: translateY(-1px); }
    .mobile-controls, .mobile-tutorial { display: none; }
    @media (pointer: coarse) { .topbar { padding: 14px; } .brand { font-size: 10px; letter-spacing: .12em; } .score { font-size: 15px; } .hint { display:none; } .card { width: min(88%, 360px); padding: 22px 18px; } .mobile-controls { display: block; position: absolute; z-index: 3; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); } .mobile-controls button { pointer-events: auto; touch-action: manipulation; width: 82px; height: 82px; padding: 0; font-size: 13px; letter-spacing: .08em; background: #6ce7ff; color: #071329; border: 1px solid #c0f8ff; box-shadow: 0 0 24px #52dfff88; } .mobile-tutorial { position: absolute; z-index: 3; left: 50%; bottom: max(116px, calc(env(safe-area-inset-bottom) + 98px)); width: min(300px, calc(100% - 36px)); transform: translateX(-50%); padding: 11px 14px; border: 1px solid #76dcff55; border-radius: 14px; background: #091739dd; color: #d7f4ff; font-size: 13px; line-height: 1.4; text-align: center; box-shadow: 0 10px 30px #0008; pointer-events: none; } .mobile-tutorial.is-hidden { display: none; } }
    @media (max-width: 900px) and (orientation: landscape) and (pointer: coarse) { .mobile-controls { left: auto; right: max(20px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); transform: none; } .mobile-tutorial { left: auto; right: max(118px, calc(env(safe-area-inset-right) + 104px)); bottom: max(20px, env(safe-area-inset-bottom)); transform: none; width: 260px; } }
  </style>
</head>
<body>
  <audio id="level-music" loop preload="auto"></audio>
  <main class="shell">
    <div class="topbar"><div class="brand" id="mission-label">✦ Night Flight / Level 1</div><div class="score">SCORE <span id="score">0000</span></div></div>
    <section class="game-wrap">
      <canvas id="game" aria-label="Night sky jet runner game"></canvas>
      <div class="hint">← / → to change lanes · SPACE to fire · avoid enemy fire</div>
      <div class="mobile-controls"><button id="fire" class="fire" aria-label="Fire weapon">FIRE</button></div>
      <div class="mobile-tutorial" id="mobile-tutorial" role="status">Drag left or right to steer · Tap FIRE to shoot.</div>
      <div class="panel" id="panel"><div class="card"><h1 id="title">Night Flight</h1><p id="message">Guide your jet through the midnight skyline.</p><button id="start">Start flight</button></div></div>
    </section>
  </main>
  <script>
    const isLevelTwo = new URLSearchParams(location.search).get('level') === '2';
    const canvas = document.getElementById('game'), ctx = canvas.getContext('2d'), levelMusic = document.getElementById('level-music');
    const startLevelMusic=()=>{if(!isLevelTwo)levelMusic.play().catch(()=>{});};
    if(!isLevelTwo){levelMusic.src='assets/level1-theme.ogg';levelMusic.load();document.addEventListener('pointerdown',startLevelMusic,{once:true,capture:true});document.addEventListener('keydown',startLevelMusic,{once:true,capture:true});startLevelMusic();}
    const scoreEl = document.getElementById('score'), panel = document.getElementById('panel'), title = document.getElementById('title'), message = document.getElementById('message'), start = document.getElementById('start'), fireButton = document.getElementById('fire'), mobileTutorial = document.getElementById('mobile-tutorial'), missionLabel = document.getElementById('mission-label');
    if(isLevelTwo){document.title='Space Mission — Level 2';missionLabel.textContent='✦ Nebula Run / Level 2';}
    let W, H, dpr, sceneScale, jet, stars, planets, nextPlanets, comets, enemies, bolts, shots, score, playing = false, last = 0, spaceOffset = 0, planetCycle = 0, enemySpawn = 0, fireCooldown = 0, dragPointerId = null, dragLane = null, dragStartX = 0, dragJetStartX = 0, dragTargetX = null;
    setInterval(()=>{if(isLevelTwo&&playing)enemySpawn=Math.max(0,enemySpawn-18);},1000);
    const resize = () => { const r = canvas.getBoundingClientRect(); dpr = Math.min(devicePixelRatio || 1, 2); W = r.width; H = r.height; sceneScale = Math.max(.8, Math.min(W/1100, H/650)); canvas.width = W*dpr; canvas.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); stars = Array.from({length: Math.max(180, W/3)}, () => ({x: Math.random()*W, y: Math.random()*H, r: Math.random()*2+.25, a: Math.random()*.75+.16, speed: .025+Math.random()*.08})); createPlanets(planetCycle); comets=[{x:W*.18,y:H*.63,phase:0,s:1},{x:W*.86,y:H*.12,phase:2.3,s:.7},{x:W*.45,y:H*.39,phase:4.4,s:.5}]; };
    function makePlanetSet(cycle) { const unit=Math.min(W,H), palettes=[['#69c9ee','#14285e','blue'],['#f1bd74','#8b3944','rust'],['#c99af0','#38245f','violet'],['#9ed6a2','#1e554c','blue']]; return Array.from({length:2},(_,i)=>{const p=palettes[(Math.floor(Math.random()*palettes.length)+cycle+i)%palettes.length];return {x:W*(.16+Math.random()*.68),y:H*(.13+Math.random()*.38),r:unit*(.03+Math.random()*.055),c:p[0],shade:p[1],kind:p[2],ring:Math.random()>.72,a:.16+Math.random()*.16};}); }
    function createPlanets(cycle) { planets=makePlanetSet(cycle);nextPlanets=makePlanetSet(cycle+1); }
    const laneX = lane => W * (.25 + lane * .25);
    const reset = () => { jet = {x: laneX(1), y: H*.82, lane: 1}; enemies=[];bolts=[];shots=[];fireCooldown=0;enemySpawn=isLevelTwo?38:65;spaceOffset=0;score=0;planetCycle=0;dragPointerId=null;dragLane=null;dragTargetX=null;createPlanets(planetCycle);scoreEl.textContent='0000'; };
    function drawPlanet(p) { ctx.save();ctx.globalAlpha=p.a;ctx.translate(p.x,p.y);ctx.shadowColor=p.c;ctx.shadowBlur=p.r*.28;ctx.fillStyle=p.c+'44';ctx.beginPath();ctx.arc(0,0,p.r*1.08,0,7);ctx.fill();ctx.shadowBlur=0;if(p.ring){ctx.strokeStyle='#ffe2d177';ctx.lineWidth=p.r*.14;ctx.beginPath();ctx.ellipse(0,0,p.r*1.72,p.r*.42,-.28,0,7);ctx.stroke();}ctx.save();ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.clip();const orb=ctx.createRadialGradient(-p.r*.38,-p.r*.43,p.r*.04,0,0,p.r*1.05);orb.addColorStop(0,'#ffffffaa');orb.addColorStop(.18,p.c);orb.addColorStop(.7,p.shade);orb.addColorStop(1,'#05091f');ctx.fillStyle=orb;ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2);if(p.kind==='blue'){ctx.strokeStyle='#d8fbff42';ctx.lineWidth=p.r*.09;[-.45,-.05,.35].forEach(y=>{ctx.beginPath();ctx.moveTo(-p.r,y*p.r);ctx.bezierCurveTo(-p.r*.25,y*p.r-p.r*.16,p.r*.38,y*p.r+p.r*.14,p.r,y*p.r-p.r*.04);ctx.stroke();});}else{ctx.fillStyle=p.kind==='rust'?'#6d353a66':'#fff2df38';[[-.35,-.15,.18],[.28,.21,.13],[-.05,.43,.1],[.38,-.38,.08]].forEach(c=>{ctx.beginPath();ctx.arc(c[0]*p.r,c[1]*p.r,c[2]*p.r,0,7);ctx.fill();ctx.strokeStyle='#321c3a44';ctx.lineWidth=p.r*.025;ctx.stroke();});}ctx.restore();ctx.strokeStyle='#ffffff33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.stroke();ctx.restore(); }
    function drawSky(t) { const drift=spaceOffset,progress=(score%20)/20,scale=1+progress*.28,fade=1-progress*.94,incoming=Math.max(0,(progress-.52)/.48);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090c45');g.addColorStop(.43,'#080d31');g.addColorStop(1,'#020615');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);[[W*.56+drift*.08,H*.39,W*.30,'#1875d944'],[W*.63+drift*.12,H*.53,W*.22,'#b04acb3d'],[W*.47,H*.25,W*.25,'#5a55f033']].forEach(n=>{const glow=ctx.createRadialGradient(n[0],n[1],0,n[0],n[1],n[2]);glow.addColorStop(0,n[3]);glow.addColorStop(.45,n[3].slice(0,7)+'18');glow.addColorStop(1,'#00000000');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);});ctx.fillStyle='#eaf7ff';stars.forEach(s=>{const x=(s.x+drift*(.7+s.r)+W)%W,y=(s.y+t*s.speed)%H;ctx.globalAlpha=s.a*(.65+.35*Math.sin(t/560+s.x));ctx.beginPath();ctx.arc(x,y,s.r,0,7);ctx.fill();});ctx.globalAlpha=1;planets.forEach(p=>drawPlanet({...p,x:W*.5+(p.x-W*.5)*scale+drift*.16,y:p.y+progress*H*.035,r:p.r*scale,a:p.a*fade}));nextPlanets.forEach(p=>drawPlanet({...p,x:W*.5+(p.x-W*.5)*(.78+incoming*.22)+drift*.16,y:p.y-(1-incoming)*H*.035,r:p.r*(.78+incoming*.22),a:p.a*incoming}));comets.forEach(c=>{const x=(c.x+t*.08*c.s+drift*.38)% (W+160)-80,y=(c.y+t*.035*c.s)% (H+120)-60;ctx.save();ctx.translate(x,y);ctx.rotate(-.48);const tail=ctx.createLinearGradient(-100,0,8,0);tail.addColorStop(0,'#ffffff00');tail.addColorStop(.75,'#7be9ff99');tail.addColorStop(1,'#fff');ctx.strokeStyle=tail;ctx.lineWidth=2+c.s*2;ctx.beginPath();ctx.moveTo(-110,0);ctx.lineTo(0,0);ctx.stroke();ctx.fillStyle='#fff';ctx.shadowColor='#73eaff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(2,0,2+c.s,0,7);ctx.fill();ctx.restore();}); }
    function drawFlightPath(t) { ctx.save();const path=ctx.createLinearGradient(0,H,0,H*.12);path.addColorStop(0,'#367dce18');path.addColorStop(.7,'#489cff0a');path.addColorStop(1,'#7cecff00');ctx.fillStyle=path;ctx.beginPath();ctx.moveTo(W*.16,H);ctx.lineTo(W*.5,H*.13);ctx.lineTo(W*.84,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#76dfff20';ctx.lineWidth=1;ctx.setLineDash([3,22]);ctx.lineDashOffset=t*.24;[W*.16,W*.84].forEach(x=>{ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(W*.5,H*.13);ctx.stroke();});ctx.restore();drawDragLane(); }
    function drawDragLane() { if(dragLane===null)return;const x=laneX(dragLane);ctx.save();const glow=ctx.createLinearGradient(0,H,0,H*.13);glow.addColorStop(0,'#73eaff24');glow.addColorStop(.65,'#73eaff0a');glow.addColorStop(1,'#73eaff00');ctx.fillStyle=glow;ctx.beginPath();ctx.moveTo(x-W*.13,H);ctx.lineTo(W*.5,H*.13);ctx.lineTo(x+W*.13,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#8ff7ff55';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-W*.13,H);ctx.lineTo(W*.5,H*.13);ctx.lineTo(x+W*.13,H);ctx.stroke();ctx.restore(); }
    function drawJet() { ctx.save();ctx.translate(jet.x,jet.y);ctx.rotate((jet.x-laneX(jet.lane))*.004);ctx.scale(sceneScale,sceneScale);if(isLevelTwo){ctx.shadowColor='#8beaff';ctx.shadowBlur=19;ctx.fillStyle='#242a34';ctx.beginPath();ctx.moveTo(0,-51);ctx.lineTo(13,-12);ctx.lineTo(42,12);ctx.lineTo(46,35);ctx.lineTo(19,27);ctx.lineTo(13,43);ctx.lineTo(-13,43);ctx.lineTo(-19,27);ctx.lineTo(-46,35);ctx.lineTo(-42,12);ctx.lineTo(-13,-12);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#aeb7c2';ctx.beginPath();ctx.moveTo(0,-48);ctx.lineTo(9,-12);ctx.lineTo(27,13);ctx.lineTo(11,20);ctx.lineTo(0,36);ctx.lineTo(-11,20);ctx.lineTo(-27,13);ctx.lineTo(-9,-12);ctx.closePath();ctx.fill();ctx.fillStyle='#0a0e17';ctx.beginPath();ctx.moveTo(0,-40);ctx.lineTo(7,-10);ctx.lineTo(5,14);ctx.lineTo(0,24);ctx.lineTo(-5,14);ctx.lineTo(-7,-10);ctx.closePath();ctx.fill();ctx.fillStyle='#d84b56';[[-28,17,9,16],[28,17,-9,16]].forEach(p=>{ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(p[2]*.03);ctx.fillRect(-4,-8,8,16);ctx.restore();});ctx.fillStyle='#596572';ctx.fillRect(-21,14,10,15);ctx.fillRect(11,14,10,15);ctx.fillStyle='#7eeaff';[-8,8].forEach(x=>{ctx.shadowColor='#4ddfff';ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(x-4,39);ctx.lineTo(x,52);ctx.lineTo(x+4,39);ctx.fill();});}else{ctx.shadowColor='#62dfff';ctx.shadowBlur=22;ctx.fillStyle='#e8faff';ctx.beginPath();ctx.moveTo(0,-43);ctx.lineTo(11,7);ctx.lineTo(33,24);ctx.lineTo(10,23);ctx.lineTo(6,31);ctx.lineTo(-6,31);ctx.lineTo(-10,23);ctx.lineTo(-33,24);ctx.lineTo(-11,7);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#55c9ee';ctx.beginPath();ctx.ellipse(0,-12,5,16,0,0,7);ctx.fill();ctx.fillStyle='#87e8ff';ctx.fillRect(-20,12,40,4);ctx.fillStyle='#ffb45e';[-7,7].forEach(x=>{ctx.beginPath();ctx.moveTo(x-4,27);ctx.lineTo(x,43);ctx.lineTo(x+4,27);ctx.fill();});}ctx.restore(); }
    function drawEnemy(e) { ctx.save();ctx.translate(e.x,e.y);ctx.scale(sceneScale,sceneScale);if(e.type==='meteor'){const colors=[['#8476d4','#51458f','#1d1a3b','#17162e','#9384d6','#6c5bea'],['#e38b61','#9a4b45','#351b2c','#24141d','#efaa78','#ef6e54'],['#69c7c9','#2c7988','#102b3a','#0b1b27','#81dede','#46cbd3'],['#b5d46f','#607e45','#213326','#15231a','#d8ed8c','#9dda63']][e.style||0];ctx.rotate(e.rot);ctx.scale(e.stretch,1/e.stretch);ctx.shadowColor=colors[5];ctx.shadowBlur=e.r*.22;const rock=ctx.createRadialGradient(-e.r*.34,-e.r*.4,e.r*.04,0,0,e.r*1.05);rock.addColorStop(0,colors[0]);rock.addColorStop(.48,colors[1]);rock.addColorStop(1,colors[2]);ctx.fillStyle=rock;ctx.beginPath();for(let i=0;i<e.sides;i++){const a=i*Math.PI*2/e.sides,r=e.r*(.82+((i*29)%19)/100);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.shadowBlur=0;[[-.3,-.22,.2,.13,-.35],[.25,-.1,.25,.14,.42],[-.08,.3,.16,.1,-.7]].forEach(c=>{ctx.save();ctx.rotate(c[4]);ctx.fillStyle=colors[3];ctx.beginPath();ctx.ellipse(c[0]*e.r,c[1]*e.r,c[2]*e.r,c[3]*e.r,0,0,7);ctx.fill();ctx.strokeStyle=colors[4]+'66';ctx.lineWidth=Math.max(1,e.r*.035);ctx.stroke();ctx.restore();});ctx.strokeStyle=colors[4]+'55';ctx.lineWidth=Math.max(1,e.r*.035);ctx.beginPath();ctx.arc(-e.r*.1,-e.r*.12,e.r*.72,3.75,5.35);ctx.stroke();}else{const ship=[['#5b46bf','#b8a6ff','#62e7ff'],['#a23b79','#ff9dc9','#ffd766'],['#277e88','#7fe8df','#a8ff9a']][e.shipStyle||0];ctx.shadowColor=ship[2];ctx.shadowBlur=e.r*.42;ctx.fillStyle=ship[0];ctx.beginPath();ctx.ellipse(0,e.r*.32,e.r*1.35,e.r*.44,0,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=ship[1];ctx.beginPath();ctx.ellipse(0,-e.r*.08,e.r*.58,e.r*.5,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#171b42';ctx.beginPath();ctx.ellipse(0,-e.r*.13,e.r*.39,e.r*.27,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle=ship[2];[-.72,0,.72].forEach(x=>{ctx.beginPath();ctx.arc(x*e.r,e.r*.35,e.r*.1,0,7);ctx.fill();});}ctx.restore(); }
    function drawBolt(b) { ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx)-Math.PI/2);ctx.strokeStyle=b.color||'#ff67dc';ctx.shadowColor=b.color||'#ff67dc';ctx.shadowBlur=12*sceneScale;ctx.lineWidth=3*sceneScale;ctx.beginPath();ctx.moveTo(0,-10*sceneScale);ctx.lineTo(0,10*sceneScale);ctx.stroke();ctx.restore(); }
    function drawShot(s) { ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle);ctx.strokeStyle='#8ff8ff';ctx.shadowColor='#4ae8ff';ctx.shadowBlur=14*sceneScale;ctx.lineWidth=3*sceneScale;ctx.beginPath();ctx.moveTo(0,10*sceneScale);ctx.lineTo(0,-12*sceneScale);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-10*sceneScale,3*sceneScale,0,7);ctx.fill();ctx.restore(); }
    function end(){if(!playing)return;playing=false;dragPointerId=null;dragLane=null;dragTargetX=null;title.textContent='Ohoh, you died!';message.textContent=`Score: ${Math.floor(score)}`;start.textContent='Start again';panel.style.display='grid';}
    function loop(t) { const dt=Math.min((t-last)/16.67,2);last=t;if(playing){jet.x+=((dragTargetX??laneX(jet.lane))-jet.x)*Math.min(.22*dt,1);spaceOffset+=((W*.5-jet.x)*.85-spaceOffset)*Math.min(.09*dt,1);fireCooldown=Math.max(0,fireCooldown-dt);enemySpawn-=dt;if(enemySpawn<=0){const type=Math.random()<.58?'meteor':'ship',lane=Math.floor(Math.random()*3),baseR=type==='meteor'?17+Math.random()*15:20;enemies.push({type,lane,targetX:laneX(lane),x:W*.5,y:H*.13,r:baseR*.42,baseR,p:0,speed:.006+Math.random()*.002,rot:Math.random()*7,spin:(Math.random()-.5)*.08,fire:12,burst:0,style:Math.floor(Math.random()*4),shipStyle:Math.floor(Math.random()*3),sides:7+Math.floor(Math.random()*6),stretch:.78+Math.random()*.45,passed:false,lastSecond:false});enemySpawn=62+Math.random()*65;}enemies.forEach(e=>{e.p+=e.speed*dt;e.x=W*.5+(e.targetX-W*.5)*e.p;e.y=H*.13+(jet.y-H*.13)*e.p;e.r=e.baseR*(.42+e.p*.76);e.rot+=e.spin*dt;if(e.type==='ship'){e.fire-=dt;if(e.fire<=0&&e.p>.36&&e.p<.76){const dx=jet.x-e.x,dy=jet.y-(e.y+e.r),distance=Math.hypot(dx,dy)||1,speed=5.5;bolts.push({x:e.x,y:e.y+e.r,vx:dx/distance*speed,vy:dy/distance*speed,color:['#62e7ff','#ffd766','#a8ff9a'][e.shipStyle]});if(e.burst<2){e.burst++;e.fire=11;}else{e.burst=0;e.fire=52+Math.random()*35;}}}});bolts.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;});shots.forEach(s=>{s.p-=s.speed*dt;s.x=W*.5+(s.startX-W*.5)*s.p;s.y=H*.13+(jet.y-H*.13)*s.p;});shots=shots.filter(s=>s.p>0&&!s.hit);shots.forEach(s=>enemies.forEach(e=>{if(!s.hit&&!e.hit&&Math.hypot(s.x-e.x,s.y-e.y)<e.r){e.hp=(e.hp??(isLevelTwo?2:1))-1;s.hit=true;if(e.hp<=0){e.hit=true;score+=2;}}}));enemies=enemies.filter(e=>e.p<1.16&&!e.hit);bolts=bolts.filter(b=>b.y<H+30&&b.x>-30&&b.x<W+30);enemies.forEach(e=>{if(!e.passed&&e.p>1.03){e.passed=true;score+=1+(e.lastSecond?1:0);}if(Math.hypot(jet.x-e.x,jet.y-e.y)<e.r+20)end();});bolts.forEach(b=>{if(Math.hypot(jet.x-b.x,jet.y-b.y)<18)end();});const nextCycle=Math.floor(score/20);if(nextCycle!==planetCycle){planetCycle=nextCycle;planets=nextPlanets;nextPlanets=makePlanetSet(planetCycle+1);}scoreEl.textContent=String(Math.floor(score)).padStart(4,'0');}drawSky(t);drawFlightPath(t);enemies.forEach(drawEnemy);bolts.forEach(drawBolt);shots.forEach(drawShot);drawJet();requestAnimationFrame(loop); }
    function begin(){reset();playing=true;panel.style.display='none';last=performance.now();}
    function changeLane(amount){if(!playing)return;const oldLane=jet.lane,newLane=Math.max(0,Math.min(2,oldLane+amount));if(newLane!==oldLane){enemies.forEach(e=>{if(e.lane===oldLane&&e.p>.7&&e.p<1.02)e.lastSecond=true;});jet.lane=newLane;}}
    function fire(){if(playing&&fireCooldown===0){const dx=W*.5-jet.x,dy=H*.13-jet.y;shots.push({startX:jet.x,x:jet.x,y:jet.y-42*sceneScale,p:1,speed:.022,angle:Math.atan2(dy,dx)-Math.PI/2});fireCooldown=12;}}
    function dismissMobileTutorial(){mobileTutorial.classList.add('is-hidden');}
    function steerFromDrag(clientX){if(!playing)return;const rect=canvas.getBoundingClientRect(),minX=laneX(0),maxX=laneX(2);dragTargetX=Math.max(minX,Math.min(maxX,dragJetStartX+clientX-dragStartX));const targetLane=[0,1,2].reduce((closest,lane)=>Math.abs(laneX(lane)-dragTargetX)<Math.abs(laneX(closest)-dragTargetX)?lane:closest,0);dragLane=targetLane;changeLane(targetLane-jet.lane);}
    function stopDrag(e){if(e.pointerId!==dragPointerId)return;dragPointerId=null;dragLane=null;dragTargetX=null;if(canvas.hasPointerCapture?.(e.pointerId))canvas.releasePointerCapture(e.pointerId);}
    canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||!playing||dragPointerId!==null)return;dragPointerId=e.pointerId;dragLane=jet.lane;dragStartX=e.clientX;dragJetStartX=jet.x;dragTargetX=jet.x;canvas.setPointerCapture?.(e.pointerId);dismissMobileTutorial();e.preventDefault();},{passive:false});
    canvas.addEventListener('pointermove',e=>{if(e.pointerId!==dragPointerId)return;steerFromDrag(e.clientX);e.preventDefault();},{passive:false});
    canvas.addEventListener('pointerup',stopDrag);canvas.addEventListener('pointercancel',stopDrag);
    addEventListener('resize',resize);addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();if(!e.repeat)changeLane(e.code==='ArrowLeft'?-1:1);}if(e.code==='Space'){e.preventDefault();fire();}if(e.code==='Enter'&&!playing)begin();});start.onclick=begin;
    fireButton.addEventListener('pointerdown',e=>{dismissMobileTutorial();e.stopPropagation();if(e.pointerType!=='mouse'){fire();e.preventDefault();}},{passive:false});fireButton.onclick=fire;
    resize(); begin(); requestAnimationFrame(loop);
  </script>
